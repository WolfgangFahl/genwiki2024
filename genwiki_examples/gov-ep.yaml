# SPARQL endpoints declaration for sparqlquery tool
# see https://github.com/WolfgangFahl/pyLoDStorage
endpoints:
    'gov':
      endpoint: https://gov-sparql.genealogy.net/dataset/sparql
      website: https://gov-sparql.genealogy.net/
      database: gov-genealogy
      method: POST
      lang: sparql
      prefix_sets:
        - gov
        - rdf
        - dc
        - foaf
        - time
        - prov
        - osm
    'govb':
      endpoint: http://localhost:9898/bigdata/sparql
      website: https://gov-sparql.genealogy.net/
      database: blazegraph
      method: POST
      lang: sparql
      prefix_sets:
        - gov
        - rdf
        - dc
        - foaf
        - time
        - prov
        - osm
