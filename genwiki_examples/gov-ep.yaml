# SPARQL endpoints declaration for sparqlquery tool
# see https://github.com/WolfgangFahl/pyLoDStorage
'gov':
  endpoint: https://gov-sparql.genealogy.net/dataset/sparql
  website: https://gov-sparql.genealogy.net/
  database: gov-genealogy
  method: POST
  lang: sparql
  prefixes: |
    PREFIX gov: <http://gov.genealogy.net/>
    PREFIX gp: <http://gov.genealogy.net/ontology.owl#>
    PREFIX gt: <http://gov.genealogy.net/types.owl#>
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    PREFIX owl: <http://www.w3.org/2002/07/owl#>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX dc: <http://purl.org/dc/terms/>
    PREFIX dc11: <http://purl.org/dc/elements/1.1/>
    PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
    PREFIX geo: <http://www.opengis.net/ont/geosparql#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>
    PREFIX time: <http://www.w3.org/2006/time#>
    PREFIX prov: <http://www.w3.org/ns/prov#>
