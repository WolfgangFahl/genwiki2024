[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genwiki2024"
description = "Prototyp Semantifizierung Genealogieforschung"
keywords = ["nicegui", "genealogy", "mediawiki", "semantic"]
authors = [
  {name = "Wolfgang Fahl", email = "wf@bitplan.com"}
]
maintainers = [
  {name = "Wolfgang Fahl", email = "wf@bitplan.com"},
]
readme = "README.md"
license= "Apache-2.0"
dependencies = [
	# https://pypi.org/project/pybasemkit/
	# https://github.com/WolfgangFahl/pybasemkit
	# Python base module kit: YAML/JSON I/O, structured logging, CLI tooling, shell execution, and remote pydevd debug support.
	"pybasemkit>=0.1.2",
	# Wikipush toolkit
	# https://wiki.bitplan.com/index.php/Py-3rdparty-mediawiki
	"py-3rdparty-mediawiki>=0.17.0",
	# https://pypi.org/project/py-ez-wikidata/
	"py-ez-wikidata>=0.3.2",

	# Template parsing
	# https://pypi.org/project/mwparserfromhell/
	"mwparserfromhell>=0.7.2",
	# reactive user interface
	# nicegui
	# fastapi
	# uvicorn
	#"nicegui>=2.20.0",
	"ngwidgets>=0.30.0",
	# progress bar
	# https://pypi.org/project/tqdm/
	"tqdm>=4.66.5",
	# Parquet file access
	# https://arrow.apache.org/docs/python/index.html
	"pyarrow>=17.0.0",

	# OWL API
	# https://pypi.org/project/owlapy/1.6.1/
	# "owlapy>=1.6.1", conflicts with nicegui
	owlapy>=1.5.0,<1.6

	# HTTP requests library
	# https://pypi.org/project/requests/
	"requests>=2.31.0",

	# Nominatim geocoding library
	# https://pypi.org/project/geopy/
	"geopy>=2.3.0",

	# https://pypi.org/project/geocoder/
	"geocoder>=1.38.1",

	# platform independent knowledge graph ready list of dicts (table) handling
	# https://pypi.org/project/pyLodStorage/
	"pyLodStorage>=0.17.5",

	# Wikidata Grid and WdItemSearch
	# https://pypi.org/project/wdgrid/
	"wdgrid>=0.1.2",
	# command line progress bar
	# https://pypi.org/project/tqdm/
	"tqdm>=4.66.5",
	# https://github.com/FriedrichFroebel/python-djvulibre
	# https://pypi.org/project/djvulibre-python/
	"djvulibre-python>=0.9.1",
	# https://pypi.org/project/pycairo/
	"pycairo>=1.27.0",
	# Image processing library for PNG/JPG conversion and resizing
	# https://pypi.org/project/Pillow/
	"Pillow>=11.1.0",
	# https://pypi.org/project/numpy/
	"numpy>=2.2.6"
]

requires-python = ">=3.10"
classifiers=[
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License"
    ]
dynamic = ["version"]
[tool.hatch.version]
path = "genwiki/__init__.py"

[project.urls]
Home = "https://github.com/WolfgangFahl/genwiki2024"
Documentation = "https://wiki.bitplan.com/index.php/genwiki2024"
Source = "https://github.com/WolfgangFahl/genwiki2024"

[project.optional-dependencies]
test = [
  "green",
]

[tool.hatch.build.targets.wheel]
only-include = ["genwiki","genwiki_examples"]

[tool.hatch.build.targets.wheel.sources]
"genwiki" = "genwiki"
"genwiki_examples" = "genwiki_examples"

[project.scripts]
genwiki  = "genwiki.genwiki_cmd:main"
djvuconv = "genwiki.djvu_cmd:main"

